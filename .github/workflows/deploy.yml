name: Deploy

# WHY THIS EXISTS
#
# Vercel refuses to build any Git-integration deployment whose commit author is
# not a member of the Vercel team. A collaborator who is not on that team would
# merge to main and watch the site never change - the deployment shows as
# "Blocked", with no build error to read anywhere. Preview deploys are gated the
# same way, so they could not even see their own work rendered.
#
# The CLI does NOT bypass that check on its own. It reads the commit author out
# of the local git context and uploads it, so a collaborator's commit is blocked
# exactly the same way. Proven 2026-08-06 on kohler-law-group-marketing: two
# production CLI deploys 32 minutes apart, identical except the author email.
# `spencer@flyinggoatagency.com`, which maps to no GitHub account, went READY.
# `313148569+flyinggoatagency@users.noreply.github.com`, which maps to a GitHub
# user holding no seat on this team, went BLOCKED. What actually bypasses the
# check is having no resolvable author at all, which the Deploy step below
# guarantees. So we deploy from Actions using a token scoped to THIS PROJECT
# ONLY. That token cannot read, deploy, or
# even list any other project on the team, and it cannot mint a wider token.
# Anyone with write access to this repo already controls this project's source,
# so the secret grants them nothing they did not already have.
#
# Vercel's own Git auto-deploy is turned off in vercel.json, so this workflow is
# the single deploy path and the two cannot race on the same merge.
#
# DO NOT add `vercel pull` or `vercel build --prebuilt` here. Both require
# team-level API access that a project-scoped token deliberately does not have,
# and fail with "Could not retrieve Project Settings". We upload source and let
# Vercel build remotely, which is better anyway: Vercel injects the project's own
# environment variables server-side, and the build it runs is still this repo's
# `npm run build`, so the A2P compliance gate keeps enforcing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Production is serialized and never cancelled mid-flight. Preview builds
# supersede their own older runs on the same branch.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    # Repos that have not been wired yet (the template itself, for example) skip
    # this entirely rather than failing. `vars` is readable in a job-level if;
    # `secrets` is not, which is why wiring is detected via the variable.
    if: vars.VERCEL_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check this repo is fully wired
        run: |
          test -n "$VERCEL_TOKEN"  || { echo "::error::VERCEL_PROJECT_ID is set but the VERCEL_TOKEN secret is missing. Re-run wire_repo.py for this repo."; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::VERCEL_ORG_ID variable is missing. Re-run wire_repo.py for this repo."; exit 1; }

      - run: npm install --global vercel@latest

      - name: Deploy
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            PROD=--prod
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            PROD=
            echo "target=preview" >> "$GITHUB_OUTPUT"
          fi
          # Capture the commit details while git is still present, and carry them
          # as plain deployment metadata so the dashboard still shows what
          # shipped. Read via git rather than the event payload so a crafted
          # commit message cannot be interpolated into this script.
          SHA=$(git rev-parse --short HEAD)
          AUTHOR=$(git log -1 --pretty='%an')
          SUBJECT=$(git log -1 --pretty='%s' | tr -d '"' | cut -c1-120)
          echo "sha=$SHA"       >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

          # KEEP THIS. It is the entire reason a collaborator can deploy without a
          # Vercel seat. Vercel blocks any deployment whose commit author email
          # resolves to a GitHub user with no seat on this team, and it reads that
          # email from the git context even on a CLI deploy. A blocked deployment
          # never starts building, so the command below would hang until the job
          # limit and wedge every later push in this concurrency group behind it.
          # Discarding the git context leaves no author to resolve, so the check
          # cannot fire. Verified on fga-marketing-site-e2e-verify with a commit
          # authored by an account holding no Vercel seat.
          rm -rf .git

          # Blocks until the remote build finishes and exits non-zero if it fails,
          # so this step is the build gate as well as the deploy. The timeout is a
          # backstop: a deploy that cannot progress has to fail loudly instead of
          # holding the queue for the full six-hour job limit.
          URL=$(timeout 20m vercel deploy $PROD --yes --token="$VERCEL_TOKEN" \
                  -m "commitSha=$SHA" \
                  -m "commitAuthor=$AUTHOR" \
                  -m "commitMessage=$SUBJECT" \
                  -m "githubRunId=$GITHUB_RUN_ID")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      - name: Check the deployment responds
        run: |
          URL='${{ steps.deploy.outputs.url }}'
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL" || echo 000)
          case "$CODE" in
            200)     echo "$URL -> 200 OK" ;;
            401|403) echo "::notice::$URL -> $CODE (deployment protection is on; the build itself succeeded)" ;;
            *)       echo "::error::$URL -> $CODE"; exit 1 ;;
          esac

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- environment: \`${{ steps.deploy.outputs.target }}\`"
            echo "- url: ${{ steps.deploy.outputs.url }}"
            echo "- commit: \`${{ steps.deploy.outputs.sha }}\` by \`${{ steps.deploy.outputs.author }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
